[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Client-side routing (react-router) fallback. Netlify serves this only
# when no static file and no function path (see netlify/functions/api.ts's
# `path: "/api/*"` config) already matched the request.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
